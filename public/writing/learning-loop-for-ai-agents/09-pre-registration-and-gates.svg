<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Pre-register the test, pin the code, gate each stage</title>
<desc id="d">A registration file with hypothesis, pass line, sample, prompt and code hashes and an empty deviations list; a note that a hash mismatch refuses the run. Beside it, seven stages with what the person checks at each sign-off.</desc>
<defs>
<marker id="ah-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#4F46E5"/></marker>
<marker id="ah-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#8A8F9C"/></marker>
<marker id="ah-human" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#B45309"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBFAF7"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="96" y="118" font-size="44" font-weight="600" fill="#14151A" text-anchor="start" letter-spacing="-0.6">Pre-register the test, pin the code, gate each stage</text>
<text x="96" y="162" font-size="22" font-weight="400" fill="#5B5F6B" text-anchor="start">Write the pass line before the run. Hash the code and the prompt. A mismatch refuses the run.</text>
<rect x="96" y="220" width="664" height="420" rx="12" fill="#FFFFFF" stroke="#DCDBD5" stroke-width="1.5"/>
<text x="124" y="260" font-size="14" font-weight="400" fill="#8A8F9C" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">registration.json · written before the run</text>
<text x="124" y="306" font-size="16" font-weight="400" fill="#4F46E5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;experiment&quot;:</text>
<text x="342" y="306" font-size="16" font-weight="400" fill="#14151A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;EXP-R1&quot;</text>
<text x="124" y="346" font-size="16" font-weight="400" fill="#4F46E5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;hypothesis&quot;:</text>
<text x="342" y="346" font-size="16" font-weight="400" fill="#14151A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;packages raise later-corrections-met&quot;</text>
<text x="124" y="386" font-size="16" font-weight="400" fill="#4F46E5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;pass_line&quot;:</text>
<text x="342" y="386" font-size="16" font-weight="400" fill="#14151A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;B − A ≥ 10 points; 0 unresolved leaks&quot;</text>
<text x="124" y="426" font-size="16" font-weight="400" fill="#4F46E5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;sample&quot;:</text>
<text x="342" y="426" font-size="16" font-weight="400" fill="#14151A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;10 queries after 2025-08-01, seed 20250401&quot;</text>
<text x="124" y="466" font-size="16" font-weight="400" fill="#4F46E5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;judge_prompt_sha256&quot;:</text>
<text x="342" y="466" font-size="16" font-weight="400" fill="#14151A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;3f9c…&quot;</text>
<text x="124" y="506" font-size="16" font-weight="400" fill="#4F46E5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;code_sha256&quot;:</text>
<text x="342" y="506" font-size="16" font-weight="400" fill="#14151A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;4f3a…&quot;</text>
<text x="124" y="546" font-size="16" font-weight="400" fill="#4F46E5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&quot;deviations&quot;:</text>
<text x="342" y="546" font-size="16" font-weight="400" fill="#14151A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[]</text>
<circle cx="136" cy="608" r="11" fill="#B91C1C"/><path d="M132 604 l8 8 M140 604 l-8 8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
<text x="160" y="614" font-size="16" font-weight="600" fill="#B91C1C" text-anchor="start">hash of code or prompt differs from the file → the run is refused</text>
<text x="816" y="244" font-size="12" font-weight="600" fill="#8A8F9C" text-anchor="start" letter-spacing="1.4">ONE SIGN-OFF PER STAGE · WHAT THE PERSON CHECKS</text>
<rect x="820" y="272" width="12" height="12" transform="rotate(45 826 278)" fill="#B45309" stroke="#FBFAF7" stroke-width="3"/>
<text x="850" y="284" font-size="18" font-weight="600" fill="#14151A" text-anchor="start">Record</text>
<text x="966" y="284" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="start">parser output on a sample of sessions</text>
<line x1="816" y1="302" x2="1504" y2="302" stroke="#DCDBD5"/>
<rect x="820" y="324" width="12" height="12" transform="rotate(45 826 330)" fill="#B45309" stroke="#FBFAF7" stroke-width="3"/>
<text x="850" y="336" font-size="18" font-weight="600" fill="#14151A" text-anchor="start">Enrich</text>
<text x="966" y="336" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="start">labels on a sealed sample; stability on a rerun</text>
<line x1="816" y1="354" x2="1504" y2="354" stroke="#DCDBD5"/>
<rect x="820" y="376" width="12" height="12" transform="rotate(45 826 382)" fill="#B45309" stroke="#FBFAF7" stroke-width="3"/>
<text x="850" y="388" font-size="18" font-weight="600" fill="#14151A" text-anchor="start">Group</text>
<text x="966" y="388" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="start">the vocabulary and the registry, then frozen</text>
<line x1="816" y1="406" x2="1504" y2="406" stroke="#DCDBD5"/>
<rect x="820" y="428" width="12" height="12" transform="rotate(45 826 434)" fill="#B45309" stroke="#FBFAF7" stroke-width="3"/>
<text x="850" y="440" font-size="18" font-weight="600" fill="#14151A" text-anchor="start">Extract</text>
<text x="966" y="440" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="start">items with their quotes; anything paraphrased rejected</text>
<line x1="816" y1="458" x2="1504" y2="458" stroke="#DCDBD5"/>
<rect x="820" y="480" width="12" height="12" transform="rotate(45 826 486)" fill="#B45309" stroke="#FBFAF7" stroke-width="3"/>
<text x="850" y="492" font-size="18" font-weight="600" fill="#14151A" text-anchor="start">Serve</text>
<text x="966" y="492" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="start">the rendered package and its listed cuts</text>
<line x1="816" y1="510" x2="1504" y2="510" stroke="#DCDBD5"/>
<rect x="820" y="532" width="12" height="12" transform="rotate(45 826 538)" fill="#B45309" stroke="#FBFAF7" stroke-width="3"/>
<text x="850" y="544" font-size="18" font-weight="600" fill="#14151A" text-anchor="start">Evaluate</text>
<text x="966" y="544" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="start">the judge against a hand-scored sample</text>
<line x1="816" y1="562" x2="1504" y2="562" stroke="#DCDBD5"/>
<rect x="820" y="584" width="12" height="12" transform="rotate(45 826 590)" fill="#B45309" stroke="#FBFAF7" stroke-width="3"/>
<text x="850" y="596" font-size="18" font-weight="600" fill="#14151A" text-anchor="start">Approve</text>
<text x="966" y="596" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="start">go live, or keep the previous package</text>
<text x="96" y="690" font-size="19" font-weight="400" fill="#5B5F6B" text-anchor="start">Deviations happen. Record them in the file; never edit the pass line after seeing results.</text>

<text x="96" y="860" font-size="14" font-weight="400" fill="#8A8F9C" text-anchor="start">Jitin Gupta  ·  “It doesn’t learn”: a learning loop for AI agents</text>
<text x="1504" y="860" font-size="14" font-weight="400" fill="#8A8F9C" text-anchor="end">9 / 11</text>
</g></svg>
