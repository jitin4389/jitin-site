<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">The complaint: corrected on Monday, repeated on Tuesday</title>
<desc id="d">Two chat sessions. On Monday the user says never use the word skyrocket and the assistant agrees. On Tuesday, in a new session with empty context, the assistant uses the word. Three missing things are listed: nothing records the correction in a checkable form, nothing decides which notes shape future answers, nothing measures improvement.</desc>
<defs>
<marker id="ah-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#4F46E5"/></marker>
<marker id="ah-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#8A8F9C"/></marker>
<marker id="ah-human" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#B45309"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBFAF7"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="96" y="118" font-size="44" font-weight="600" fill="#14151A" text-anchor="start" letter-spacing="-0.6">The complaint: corrected on Monday, repeated on Tuesday</text>
<text x="96" y="162" font-size="22" font-weight="400" fill="#5B5F6B" text-anchor="start">The model is stateless by design. The system around it is what forgets.</text>
<rect x="96" y="224" width="600" height="272" rx="12" fill="#FFFFFF" stroke="#DCDBD5" stroke-width="1.5"/>
<text x="124" y="260" font-size="12" font-weight="600" fill="#8A8F9C" text-anchor="start" letter-spacing="1.4">MONDAY · SESSION 1</text>
<text x="124" y="304" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="start" letter-spacing="1.2">USER</text>
<text x="124" y="330" font-size="19" font-weight="400" fill="#14151A" text-anchor="start">“Never use the word ‘skyrocket’</text>
<text x="124" y="357.6" font-size="19" font-weight="400" fill="#14151A" text-anchor="start">in anything you write for me.”</text>
<text x="124" y="394" font-size="12" font-weight="600" fill="#8A8F9C" text-anchor="start" letter-spacing="1.2">ASSISTANT</text>
<text x="124" y="420" font-size="19" font-weight="400" fill="#5B5F6B" text-anchor="start">“Understood. I will avoid it.”</text>
<circle cx="656" cy="264" r="11" fill="#4F46E5"/><path d="M651 264 l3.5 3.5 l7 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="736" y1="370" x2="864" y2="370" stroke="#8A8F9C" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah-muted)"/>
<text x="800" y="330" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="middle">new session</text>
<text x="800" y="352" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="middle">empty context</text>
<rect x="904" y="224" width="600" height="272" rx="12" fill="#FFFFFF" stroke="#DCDBD5" stroke-width="1.5"/>
<text x="932" y="260" font-size="12" font-weight="600" fill="#8A8F9C" text-anchor="start" letter-spacing="1.4">TUESDAY · SESSION 2</text>
<text x="932" y="304" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="start" letter-spacing="1.2">USER</text>
<text x="932" y="330" font-size="19" font-weight="400" fill="#14151A" text-anchor="start">“What will office paper cost</text>
<text x="932" y="357.6" font-size="19" font-weight="400" fill="#14151A" text-anchor="start">next quarter?”</text>
<text x="932" y="394" font-size="12" font-weight="600" fill="#8A8F9C" text-anchor="start" letter-spacing="1.2">ASSISTANT</text>
<text x="932" y="420" font-size="19" font-weight="400" fill="#5B5F6B" text-anchor="start">“Prices will probably skyrocket…”</text>
<circle cx="1464" cy="264" r="11" fill="#B91C1C"/><path d="M1460 260 l8 8 M1468 260 l-8 8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
<text x="96" y="566" font-size="20" font-weight="400" fill="#14151A" text-anchor="start">The model is not the part that fails to learn. Three things are missing around it:</text>
<rect x="96" y="600" width="448" height="110" rx="12" fill="#F1EFEA" stroke="#F1EFEA" stroke-width="1.5"/>
<text x="320" y="634" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="middle">Nothing records the correction</text>
<text x="320" y="656" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="middle">in a checkable form</text>
<rect x="576" y="600" width="448" height="110" rx="12" fill="#F1EFEA" stroke="#F1EFEA" stroke-width="1.5"/>
<text x="800" y="634" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="middle">Nothing decides which notes</text>
<text x="800" y="656" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="middle">should shape future answers</text>
<rect x="1056" y="600" width="448" height="110" rx="12" fill="#F1EFEA" stroke="#F1EFEA" stroke-width="1.5"/>
<text x="1280" y="634" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="middle">Nothing measures whether</text>
<text x="1280" y="656" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="middle">answers got better</text>

<text x="96" y="860" font-size="14" font-weight="400" fill="#8A8F9C" text-anchor="start">Jitin Gupta  ·  “It doesn’t learn”: a learning loop for AI agents</text>
<text x="1504" y="860" font-size="14" font-weight="400" fill="#8A8F9C" text-anchor="end">1 / 11</text>
</g></svg>
