<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Day 1 and week 1</title>
<desc id="d">Two checklists. Day 1: record schema, taxonomy enum, verbatim-quote check, verify-then-apply rendering, budget with listed cuts, package stamp on each answer. Week 1: cutoff date, extraction prompt and sample, calibrated judge, registration file, named approvers, withdrawal path and cost ceiling. Closing line: approval is a step, not a hope.</desc>
<defs>
<marker id="ah-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#4F46E5"/></marker>
<marker id="ah-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#8A8F9C"/></marker>
<marker id="ah-human" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#B45309"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBFAF7"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="96" y="118" font-size="44" font-weight="600" fill="#14151A" text-anchor="start" letter-spacing="-0.6">Day 1 and week 1</text>
<text x="96" y="162" font-size="22" font-weight="400" fill="#5B5F6B" text-anchor="start">Make learning checkable first, then provable.</text>
<rect x="96" y="220" width="680" height="412" rx="12" fill="#FFFFFF" stroke="#DCDBD5" stroke-width="1.5"/>
<text x="124" y="260" font-size="12" font-weight="600" fill="#8A8F9C" text-anchor="start" letter-spacing="1.4">DAY 1 · HALF A DAY · ONE ENGINEER</text>
<text x="124" y="298" font-size="24" font-weight="600" fill="#14151A" text-anchor="start">Make learning checkable</text>
<rect x="124" y="332" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="156" y="346" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">A record schema with provenance, written once</text>
<rect x="124" y="378" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="156" y="392" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">The taxonomy as an enum: kind, scope, owner, status</text>
<rect x="124" y="424" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="156" y="438" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">A code check: every quote is verbatim in its record</text>
<rect x="124" y="470" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="156" y="484" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">World facts rendered as dated claims to verify</text>
<rect x="124" y="516" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="156" y="530" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">A package budget, with every cut listed</text>
<rect x="124" y="562" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="156" y="576" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">Stamp each answer with the package it was served</text>
<rect x="824" y="220" width="680" height="412" rx="12" fill="#FFFFFF" stroke="#DCDBD5" stroke-width="1.5"/>
<text x="852" y="260" font-size="12" font-weight="600" fill="#8A8F9C" text-anchor="start" letter-spacing="1.4">WEEK 1 · ENGINEER + ONE REVIEWER</text>
<text x="852" y="298" font-size="24" font-weight="600" fill="#14151A" text-anchor="start">Make learning provable</text>
<rect x="852" y="332" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="884" y="346" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">A cutoff date: build before it, test after it</text>
<rect x="852" y="378" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="884" y="392" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">An extraction prompt and a hand-labelled sample</text>
<rect x="852" y="424" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="884" y="438" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">A judge prompt, calibrated against that sample</text>
<rect x="852" y="470" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="884" y="484" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">The first registration file, hashes included</text>
<rect x="852" y="516" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="884" y="530" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">A named approver per stage, and where it is recorded</text>
<rect x="852" y="562" width="18" height="18" rx="4" fill="none" stroke="#8A8F9C" stroke-width="1.5"/>
<text x="884" y="576" font-size="18" font-weight="400" fill="#14151A" text-anchor="start">A withdrawal path and a cost ceiling per stage</text>
<text x="96" y="696" font-size="28" font-weight="600" fill="#14151A" text-anchor="start">Approval is a step, not a hope.</text>

<text x="96" y="860" font-size="14" font-weight="400" fill="#8A8F9C" text-anchor="start">Jitin Gupta  ·  “It doesn’t learn”: a learning loop for AI agents</text>
<text x="1504" y="860" font-size="14" font-weight="400" fill="#8A8F9C" text-anchor="end">11 / 11</text>
</g></svg>
